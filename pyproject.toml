[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyworldbot"
version = "0.2.0"
description = "A tiny world-model + MPC playground for SO-101 contact manipulation in MuJoCo"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "toyhank"}]
dependencies = [
  "numpy>=1.26",
  "mujoco>=3.2",
  "torch>=2.2",
  "opencv-python>=4.8",
  "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tinyworldbot = "tinyworldbot.demo:main"
tinyworldbot-pickplace = "tinyworldbot.pickplace:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["tinyworldbot*"]

[tool.setuptools.package-data]
tinyworldbot = [
  "assets/so101/*.xml",
  "assets/so101/meshes/*.stl",
]
