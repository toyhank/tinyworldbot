name: smoke

on:
  push:
  pull_request:

jobs:
  model-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy mujoco pytest
      - run: PYTHONPATH=. pytest -q tests/test_smoke.py
